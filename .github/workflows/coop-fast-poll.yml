name: coop-fast-poll
on:
  schedule:
    # This USED to be "*/5", but GitHub never actually delivered that cadence.
    # Measured over 2026-07-29 the gaps between consecutive delivered runs were
    # 153, 106, 140, 79, 84, 57, 80, 46, 53 min — a median of ~80 min, not 5.
    # Nothing was failing (40/40 runs green, 0 cancelled); GitHub simply drops
    # most ticks of a high-frequency schedule under runner load, and it
    # deprioritises the more aggressively you ask.
    #
    # So cadence no longer comes from the scheduler at all. An external trigger
    # fires repository_dispatch every minute and each dispatched run does a
    # SINGLE poll — see docs/ALERTS_SETUP.md. Dispatch runs are not throttled
    # the way schedules are.
    #
    # This schedule is now only a FALLBACK: if the external trigger dies, a
    # windowed run every 30 min keeps the feed alive instead of going silent.
    # Asking less often also improves the odds these ticks are delivered.
    #
    # The window is deliberately broad. The hours you actually want alerts are
    # configured on the external trigger, in LOCAL time, where DST is handled
    # for us. GitHub cron has no timezone, so a narrow window here would drift
    # an hour every winter — which is exactly what "*/15 4-15" did.
    - cron: "*/30 6-20 * * 1-6"   # fallback only; ~08:00–22:00 Vienna, Mon–Sat
  workflow_dispatch:
    inputs:
      window_minutes:
        description: "How long this run keeps polling (minutes). 0 = single poll."
        required: false
        default: "55"
  # Lets an external scheduler drive real cadence, bypassing GitHub's throttle:
  #   curl -X POST -H "Accept: application/vnd.github+json" \
  #     -H "Authorization: Bearer $GH_PAT" \
  #     -H "Content-Type: application/json" \
  #     -H "X-GitHub-Api-Version: 2022-11-28" \
  #     https://api.github.com/repos/vladbrincoveanu/ImmoAgent/dispatches \
  #     -d '{"event_type":"coop-poll"}'
  # Point cron-job.org at that every minute with a fine-grained PAT that has
  # Contents: read and write on this repo only. Full setup and
  # verification steps: docs/ALERTS_SETUP.md.
  repository_dispatch:
    types: [coop-poll]
concurrency:
  group: coop-fast-poll
  # A newly delivered run replaces the in-flight loop rather than stacking on
  # it. Coverage continues seamlessly: the new run starts its own poll window.
  cancel-in-progress: true
jobs:
  poll:
    runs-on: ubuntu-latest
    # Must exceed POLL_WINDOW_MINUTES plus one poll's own runtime, or the job is
    # killed mid-poll and the final iteration is lost.
    timeout-minutes: 70
    env:
      # 1 min fallback gap: private Ablöse ads are first-come-first-served and draw
      # replies within minutes, so the poll gap is the whole margin.
      POLL_INTERVAL_SECONDS: 60
      # Only the manual override is passed here; empty for every other trigger.
      # The dispatch-vs-fallback default is decided in coop-poll-window.sh from
      # $GITHUB_EVENT_NAME, because the natural expression for it
      # (`event_name == 'repository_dispatch' && '0' || '55'`) is a known GitHub
      # trap: '0' casts to falsy, the `||` swallows it, and every dispatched run
      # would silently loop for 55 minutes instead of doing a single poll.
      POLL_WINDOW_MINUTES: ${{ github.event.inputs.window_minutes }}
    steps:
      - name: Warn if TELEGRAM_COOP_CHANNEL_ID secret is missing
        env:
          COOP_ID: ${{ secrets.TELEGRAM_COOP_CHANNEL_ID }}
        run: |
          if [ -z "$COOP_ID" ]; then
            # Non-fatal: the scrape + Mongo upserts that feed the /coop website must
            # run regardless. run_coop.py already logs loudly and continues without a
            # channel (alerts DISABLED, polling/upserts continue). A hard `exit 1` here
            # killed the whole poll job — so no units were scraped and the strict
            # buyable:false /coop page (which hides legacy rows) stayed empty.
            echo "::warning::TELEGRAM_COOP_CHANNEL_ID repo secret is missing — Telegram co-op alerts are disabled, but scraping/upserts (website data) still run. Add it under Settings → Secrets to enable alerts."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Project/requirements-coop.txt
      - run: pip install -r Project/requirements-coop.txt
      - name: Fast co-op poll (repeating for the poll window)
        working-directory: Project
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TELEGRAM_MAIN_BOT_TOKEN: ${{ secrets.TELEGRAM_MAIN_BOT_TOKEN }}
          TELEGRAM_COOP_CHANNEL_ID: ${{ secrets.TELEGRAM_COOP_CHANNEL_ID }}
          # Separate channel for private Ablöse hits — see Application/coop_alert_router.py
          TELEGRAM_PRIVATE_COOP_CHANNEL_ID: ${{ secrets.TELEGRAM_PRIVATE_COOP_CHANNEL_ID }}
          # User-created alerts (/alerts) can deliver by email as well as Telegram.
          # Without these the poll still runs and Telegram alerts still land; only
          # the email half is disabled, and it says so loudly in the log.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Optional mygewo filter-URL override (repo variable MYGEWO_SEARCH_URL under
          # Settings → Secrets and variables → Actions → Variables). Empty/unset uses the
          # baked default: Wien, ALL rooms/sizes/rents (states=28_) — the parser keeps only
          # rentals (buy-option units dropped) and Wien PLZ. Leave this UNSET for the full
          # Wien rental inventory; setting a narrower URL (e.g. rooms/rent bands) only
          # shrinks coverage — it is NOT needed to exclude buys or non-Wien units.
          MYGEWO_SEARCH_URL: ${{ vars.MYGEWO_SEARCH_URL }}
        # The loop lives in a script so it can be unit-tested off CI — see
        # tests/tests/test_coop_poll_window.py, run by `cd tests && python run_tests.py`.
        # (The repo tracks that directory lower-case; macOS only makes "Tests" work.)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/coop-poll-window.sh"
