name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Project/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Project/requirements.txt pytest pytest-asyncio pytest-cov
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q Project scripts tests

      - name: Run deterministic regression tests
        run: |
          mkdir -p artifacts
          python -m pytest -q --disable-warnings \
            --cov=Project \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/python-coverage.xml \
            --junitxml=artifacts/python-junit.xml \
            tests/test_pr_agent_review_gate.py \
            tests/test_observability.py \
            tests/test_workflow_dependencies.py \
            tests/tests/test_coop_poll_window.py \
            Project/Tests/test_alert_dispatcher.py \
            Project/Tests/test_alert_matcher.py \
            Project/Tests/test_coop_channel_ledger.py \
            Project/Tests/test_run_coop.py

      - name: Upload Python diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-test-reports-${{ github.run_id }}
          path: artifacts
          if-no-files-found: ignore

  dashboard:
    name: Dashboard tests, type check, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard tests
        run: npm test -- --runInBand

      - name: Type check dashboard
        run: npx tsc --noEmit

      - name: Build production dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify production HTTP endpoints
        env:
          MONGODB_URI: ""
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 >"$RUNNER_TEMP/dashboard.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:3000/api/destinations >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/dashboard.log"
          exit 1

      - name: Upload dashboard diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-build-diagnostics-${{ github.run_id }}
          path: |
            dashboard/.next/trace
            dashboard/tsconfig.tsbuildinfo
            ${{ runner.temp }}/dashboard.log
          if-no-files-found: ignore

  quality:
    name: Python static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.5

      - name: Check Python correctness
        run: ruff check Project scripts tests --select E9,F63,F7,F82

  integration:
    name: MongoDB delivery integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/immo_ci
      PYTHONPATH: .
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Project/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Project/requirements.txt pytest pytest-asyncio

      - name: Run MongoDB integration smoke test
        run: python -m pytest -q tests/test_mongodb_delivery_integration.py

  summary:
    name: Required CI summary
    if: always()
    needs: [python, dashboard, quality, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a required job did not pass
        env:
          PYTHON: ${{ needs.python.result }}
          DASHBOARD: ${{ needs.dashboard.result }}
          QUALITY: ${{ needs.quality.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          set -eu
          printf 'python=%s dashboard=%s quality=%s integration=%s\n' \
            "$PYTHON" "$DASHBOARD" "$QUALITY" "$INTEGRATION"
          if [ "$PYTHON" != success ] || \
             [ "$DASHBOARD" != success ] || \
             [ "$QUALITY" != success ] || \
             [ "$INTEGRATION" != success ]; then
            echo "::error::At least one required CI job failed or was skipped."
            exit 1
          fi
