name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Project/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Project/requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile Python sources
        run: python -m compileall -q Project tests

      - name: Run non-live tests
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts
          python -m pytest -m "not smoke" -q --junitxml=artifacts/python-junit.xml

      - name: Upload Python diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-test-results
          path: artifacts/python-junit.xml
          if-no-files-found: ignore

  dashboard-tests:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm test -- --runInBand

      - name: Type check
        run: npx tsc --noEmit

      - name: Build production bundle
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/immo
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Upload dashboard diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-build-diagnostics
          path: |
            dashboard/.next/trace
            dashboard/tsconfig.tsbuildinfo
          if-no-files-found: ignore
