name: Free AI Code Review (DeepInfra)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write # Allows the AI to post code review comments on the PR

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    steps:
      - name: Run PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          # GitHub supplies this short-lived token; PR-Agent uses it to access the PR API.
          GITHUB_TOKEN: ${{ github.token }}

          # PR-Agent's GitHub Action runner reads the provider credential from OPENAI_KEY.
          OPENAI_KEY: ${{ secrets.DEEPINFRA_TOKEN }}

          # Tell PR-Agent to talk to DeepInfra's OpenAI-compatible endpoint.
          OPENAI.API_BASE: "https://api.deepinfra.com/v1/openai"

          # Pass the exact DeepSeek V4 Flash model from your curl command
          CONFIG.MODEL: "deepseek-ai/DeepSeek-V4-Flash-0731"

          # Re-review an open PR when a new commit triggers synchronize.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
